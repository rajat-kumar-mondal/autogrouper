name: Publish to PyPI

# Runs when a GitHub release is published. PyPI Trusted Publishing signs the files,
# so no token is stored anywhere and PyPI shows the provenance of the release.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check that the release tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'EOF'
          import os, re, sys
          tag = os.environ["TAG"].lstrip("v")
          pyproject = re.search(r'^version = "([^"]+)"', open("pyproject.toml").read(), re.M).group(1)
          init = re.search(r'__version__ = "([^"]+)"', open("autogrouper/__init__.py").read()).group(1)
          if not (tag == pyproject == init):
              sys.exit("The tag (" + tag + "), pyproject.toml (" + pyproject + ") and __init__.py (" + init + ") must show the same version.")
          print("Releasing version " + tag)
          EOF

      - name: Run the tests against the installed package
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
          mkdir "$RUNNER_TEMP/run"
          cp -r tests "$RUNNER_TEMP/run/tests"
          cd "$RUNNER_TEMP/run"
          python -m pytest -q -p no:cacheprovider tests
          python -m pip uninstall -y autogrouper

      - name: Build the source package and the wheel
        run: |
          python -m pip install build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/autogrouper/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
